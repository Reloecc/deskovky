<!doctype html>
<html lang="cs">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="A board game shortlist for game night.">
   <title>Game Night Shortlist</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css">
   <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
   <br>

   <main class="layout">
      <aside class="selector" aria-label="Board game selector">
         <h2>Vhodné hry</h2>
         <div class="game-list" id="game-list" role="tablist" aria-label="Choose a board game">
         </div>
      </aside>

      <section class="content" aria-live="polite">
         <div id="game-hero-container"></div>

         <div class="tabs" role="tablist" aria-label="Game information">
            <button class="tab" role="tab" aria-selected="true" data-tab="overview">Přehled</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="rules">Jak se hraje</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="gallery">Galerie</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="shops">Obchody</button>
         </div>

         <div id="game-panel-container"></div>
      </section>
   </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
<script>
   const gameListContainer = document.querySelector('#game-list');
   const tabButtons = document.querySelectorAll('.tabs .tab');
   const heroContainer = document.querySelector('#game-hero-container');
   const panelContainer = document.querySelector('#game-panel-container');

   const validTabs = ['overview', 'rules', 'gallery', 'shops'];
   let currentGameId = 'game-1';
   let currentTab = 'overview';
   let loadedGameId = null;
   const gameCache = {};

   function parseHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').trim();
      let gameId = null;
      let tab = null;

      if (hash) {
         const parts = hash.split(/[\/\?&]/).filter(Boolean);
         for (const part of parts) {
            const lower = part.toLowerCase();
            if (/^game-\d+$/i.test(lower)) {
               gameId = lower;
            } else if (/^tab=(.+)$/i.test(lower)) {
               const val = lower.split('=')[1];
               if (validTabs.includes(val)) tab = val;
            } else if (validTabs.includes(lower)) {
               tab = lower;
            }
         }

         if (!gameId) {
            const match = hash.match(/game-\d+/i);
            if (match) {
               gameId = match[0].toLowerCase();
            }
         }
      }

      return {
         gameId: gameId || 'game-1',
         tab: (tab && validTabs.includes(tab)) ? tab : 'overview'
      };
   }

   function updateHash(gameId, tab, replace = false) {
      const newHash = `#${gameId}/${tab}`;
      if (window.location.hash !== newHash) {
         if (replace) {
            history.replaceState(null, '', newHash);
            applyRoute();
         } else {
            window.location.hash = newHash;
         }
      }
   }

   function selectTab(tabName) {
      currentTab = tabName;
      tabButtons.forEach(tab => {
         tab.setAttribute('aria-selected', tab.dataset.tab === tabName ? 'true' : 'false');
      });

      const panels = panelContainer.querySelectorAll('.tab-panel');
      panels.forEach(panel => {
         if (panel.dataset.panel === tabName) {
            panel.removeAttribute('hidden');
         } else {
            panel.setAttribute('hidden', '');
         }
      });
   }

   function initGallery() {
      const galleryItems = panelContainer.querySelectorAll('.gallery-item');
      galleryItems.forEach(item => {
         const img = item.querySelector('img');
         const caption = item.querySelector('.gallery-caption');
         if (img && !item.hasAttribute('data-src')) {
            item.setAttribute('data-src', img.src);
         }
         if (!item.hasAttribute('data-fancybox')) {
            item.setAttribute('data-fancybox', 'gallery');
         }
         if (!item.hasAttribute('data-caption')) {
            if (caption) {
               item.setAttribute('data-caption', caption.textContent.trim());
            } else if (img && img.alt) {
               item.setAttribute('data-caption', img.alt);
            }
         }
      });

      if (typeof Fancybox !== 'undefined') {
         Fancybox.unbind('[data-fancybox="gallery"]');
         Fancybox.bind('[data-fancybox="gallery"]', {});
      }
   }

   function renderGame(htmlContent, gameId) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      const hero = doc.querySelector('.game-hero');
      const panels = doc.querySelectorAll('.tab-panel');

      heroContainer.innerHTML = '';
      if (hero) {
         heroContainer.appendChild(hero);
      }

      panelContainer.innerHTML = '';
      panels.forEach(panel => {
         panelContainer.appendChild(panel);
      });

      loadedGameId = gameId;
      selectTab(currentTab);
      initGallery();
   }

   function loadGame(src, gameId) {
      if (gameCache[src]) {
         renderGame(gameCache[src], gameId);
         return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', src);
      xhr.onload = function() {
         if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText && xhr.responseText.trim().length > 0)) {
            gameCache[src] = xhr.responseText;
            if (currentGameId === gameId) {
               renderGame(xhr.responseText, gameId);
            }
         } else {
            panelContainer.innerHTML = '<p class="empty-note">Failed to load game content.</p>';
         }
      };
      xhr.onerror = function() {
         panelContainer.innerHTML = '<p class="empty-note">Error loading game content.</p>';
      };
      xhr.send();
   }

   function updateGameButtonsSelection() {
      const allButtons = gameListContainer.querySelectorAll('.game-button');
      allButtons.forEach(btn => {
         const isSelected = btn.dataset.gameId === currentGameId;
         btn.setAttribute('aria-selected', isSelected ? 'true' : 'false');
      });
   }

   function applyRoute() {
      const route = parseHash();
      currentGameId = route.gameId;
      currentTab = route.tab;

      const targetHash = `#${currentGameId}/${currentTab}`;
      if (window.location.hash !== targetHash) {
         history.replaceState(null, '', targetHash);
      }

      updateGameButtonsSelection();

      if (loadedGameId === currentGameId && panelContainer.children.length > 0) {
         selectTab(currentTab);
      } else {
         const src = `games/${currentGameId}.html`;
         loadGame(src, currentGameId);
      }
   }

   function createGameButton(src, index, htmlContent) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      const heading = doc.querySelector('.game-hero h2') || doc.querySelector('h2');
      const gameName = heading ? heading.textContent.trim() : '';
      const gameId = `game-${index}`;

      const button = document.createElement('button');
      button.className = 'game-button';
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-selected', gameId === currentGameId ? 'true' : 'false');
      button.setAttribute('data-src', src);
      button.setAttribute('data-game-id', gameId);

      const numberSpan = document.createElement('span');
      numberSpan.className = 'game-number';
      numberSpan.textContent = String(index).padStart(2, '0');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'game-name';
      nameSpan.textContent = gameName;

      button.appendChild(numberSpan);
      button.appendChild(nameSpan);

      button.addEventListener('click', () => {
         updateHash(gameId, currentTab);
      });

      gameListContainer.appendChild(button);
   }

   function loadGameList(index = 1) {
      const src = `games/game-${index}.html`;
      if (gameCache[src]) {
         createGameButton(src, index, gameCache[src]);
         loadGameList(index + 1);
         return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', src);
      xhr.onload = function() {
         if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText && xhr.responseText.trim().length > 0)) {
            gameCache[src] = xhr.responseText;
            createGameButton(src, index, xhr.responseText);
            loadGameList(index + 1);
         }
      };
      xhr.onerror = function() {
         // Stop loading next games on error
      };
      xhr.send();
   }

   tabButtons.forEach(tab => {
      tab.addEventListener('click', () => {
         const tabName = tab.dataset.tab;
         if (validTabs.includes(tabName)) {
            updateHash(currentGameId, tabName);
         }
      });
   });

   window.addEventListener('hashchange', applyRoute);

   applyRoute();
   loadGameList(1);
</script>
</body>
</html>
