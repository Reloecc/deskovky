<!doctype html>
<html lang="cs">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta name="description" content="A board game shortlist for game night.">
   <title>Game Night Shortlist</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
   <br>

   <main class="layout">
      <aside class="selector" aria-label="Board game selector">
         <h2>Vhodné hry</h2>
         <div class="game-list" id="game-list" role="tablist" aria-label="Choose a board game">
         </div>
      </aside>

      <section class="content" aria-live="polite">
         <div id="game-hero-container"></div>

         <div class="tabs" role="tablist" aria-label="Game information">
            <button class="tab" role="tab" aria-selected="true" data-tab="overview">Přehled</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="rules">Jak se hraje</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="gallery">Galerie</button>
            <button class="tab" role="tab" aria-selected="false" data-tab="shops">Obchody</button>
         </div>

         <div id="game-panel-container"></div>
      </section>
   </main>
</div>

<script>
   const gameListContainer = document.querySelector('#game-list');
   const tabButtons = document.querySelectorAll('.tabs .tab');
   const heroContainer = document.querySelector('#game-hero-container');
   const panelContainer = document.querySelector('#game-panel-container');

   let currentTab = 'overview';
   const gameCache = {};

   function selectTab(tabName) {
      currentTab = tabName;
      tabButtons.forEach(tab => {
         tab.setAttribute('aria-selected', tab.dataset.tab === tabName ? 'true' : 'false');
      });

      const panels = panelContainer.querySelectorAll('.tab-panel');
      panels.forEach(panel => {
         if (panel.dataset.panel === tabName) {
            panel.removeAttribute('hidden');
         } else {
            panel.setAttribute('hidden', '');
         }
      });
   }

   function renderGame(htmlContent) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      const hero = doc.querySelector('.game-hero');
      const panels = doc.querySelectorAll('.tab-panel');

      heroContainer.innerHTML = '';
      if (hero) {
         heroContainer.appendChild(hero);
      }

      panelContainer.innerHTML = '';
      panels.forEach(panel => {
         panelContainer.appendChild(panel);
      });

      selectTab(currentTab);
   }

   function loadGame(src) {
      if (gameCache[src]) {
         renderGame(gameCache[src]);
         return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open('GET', src);
      xhr.onload = function() {
         if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText && xhr.responseText.trim().length > 0)) {
            gameCache[src] = xhr.responseText;
            renderGame(xhr.responseText);
         } else {
            panelContainer.innerHTML = '<p class="empty-note">Failed to load game content.</p>';
         }
      };
      xhr.onerror = function() {
         panelContainer.innerHTML = '<p class="empty-note">Error loading game content.</p>';
      };
      xhr.send();
   }

   function selectGame(button) {
      const allButtons = gameListContainer.querySelectorAll('.game-button');
      allButtons.forEach(btn => {
         btn.setAttribute('aria-selected', btn === button ? 'true' : 'false');
      });
      currentTab = 'overview';
      loadGame(button.dataset.src || button.getAttribute('data-src'));
   }

   function loadGameList(index = 1) {
      const src = `games/game-${index}.html`;
      const xhr = new XMLHttpRequest();
      xhr.open('GET', src);
      xhr.onload = function() {
         if ((xhr.status >= 200 && xhr.status < 300) || (xhr.status === 0 && xhr.responseText && xhr.responseText.trim().length > 0)) {
            gameCache[src] = xhr.responseText;

            const parser = new DOMParser();
            const doc = parser.parseFromString(xhr.responseText, 'text/html');
            const heading = doc.querySelector('.game-hero h2') || doc.querySelector('h2');
            const gameName = heading ? heading.textContent.trim() : '';

            const button = document.createElement('button');
            button.className = 'game-button';
            button.setAttribute('role', 'tab');
            button.setAttribute('aria-selected', index === 1 ? 'true' : 'false');
            button.setAttribute('data-src', src);

            const numberSpan = document.createElement('span');
            numberSpan.className = 'game-number';
            numberSpan.textContent = String(index).padStart(2, '0');

            const nameSpan = document.createElement('span');
            nameSpan.className = 'game-name';
            nameSpan.textContent = gameName;

            button.appendChild(numberSpan);
            button.appendChild(nameSpan);

            button.addEventListener('click', () => {
               selectGame(button);
            });

            gameListContainer.appendChild(button);

            if (index === 1) {
               renderGame(xhr.responseText);
            }

            loadGameList(index + 1);
         }
      };
      xhr.onerror = function() {
         // Stop loading next games on error
      };
      xhr.send();
   }

   tabButtons.forEach(tab => {
      tab.addEventListener('click', () => {
         selectTab(tab.dataset.tab);
      });
   });

   loadGameList(1);
</script>
</body>
</html>
