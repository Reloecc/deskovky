<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d88c"/>
      <stop offset="50%" stop-color="#c99846"/>
      <stop offset="100%" stop-color="#735323"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>
  <!-- Background rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Isometric Die -->
  <!-- Top Face -->
  <polygon points="32,13 50,23 32,33 14,23" fill="#e6be6e" stroke="#735323" stroke-width="1" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="14,23 32,33 32,51 14,41" fill="#8f6726" stroke="#735323" stroke-width="1" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="32,33 50,23 50,41 32,51" fill="#b98835" stroke="#735323" stroke-width="1" stroke-linejoin="round"/>

  <!-- Pips Top Face -->
  <ellipse cx="32" cy="23" rx="2.4" ry="1.4" fill="#2e1a07"/>
  <ellipse cx="23" cy="18" rx="2" ry="1.2" fill="#2e1a07"/>
  <ellipse cx="41" cy="28" rx="2" ry="1.2" fill="#2e1a07"/>

  <!-- Pips Left Face -->
  <ellipse cx="20" cy="29" rx="1.6" ry="2.2" fill="#fce4ab"/>
  <ellipse cx="26" cy="35" rx="1.6" ry="2.2" fill="#fce4ab"/>
  <ellipse cx="20" cy="38" rx="1.6" ry="2.2" fill="#fce4ab"/>
  <ellipse cx="26" cy="44" rx="1.6" ry="2.2" fill="#fce4ab"/>

  <!-- Pips Right Face -->
  <ellipse cx="38" cy="36" rx="1.6" ry="2.2" fill="#fce4ab"/>
  <ellipse cx="44" cy="42" rx="1.6" ry="2.2" fill="#fce4ab"/>
</svg>
